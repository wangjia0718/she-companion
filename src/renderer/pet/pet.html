<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 图片只允许本地文件（角色 assets）与内联 data: 占位图；不引用任何网络资源 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: she-asset:; media-src 'self' file: data:; connect-src 'self' file: she-asset:; object-src 'none'">
  <title>她</title>
  <link rel="stylesheet" href="./pet.css">
</head>
<body>
  <div id="bubble" class="bubble" role="button" tabindex="-1" hidden data-i18n-skip></div>

  <div id="wave" class="wave" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div id="stage" class="stage">
    <canvas id="live2d" class="live2d" hidden></canvas>
    <div id="sway" class="sway">
      <div id="flip" class="flip">
        <img id="pet" class="pet is-placeholder" alt="她" draggable="false">
      </div>
    </div>
  </div>

  <div id="hint" class="hint" role="button" tabindex="-1" hidden>先到设置里传一张立绘</div>

  <div id="menu" class="menu" role="menu" hidden></div>

  <script src="../../shared/i18n-ui-en.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../vendor/live2dcubismcore.min.js"></script>
  <script src="../vendor/pixi.min.js"></script>
  <script src="../vendor/pixi-unsafe-eval.min.js"></script>
  <script src="../vendor/pixi-live2d-display.min.js"></script>
  <script src="./pet-click.js"></script>
  <script src="../shared/voice.js"></script>
  <script src="./live2d.js"></script>
  <script src="./pet.js"></script>
</body>
</html>
